<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}mview{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong><a href="/">mview</a></strong></li>
        </ul>
        <ul>
            <li><a href="/">Dashboard</a></li>
            <li><a href="/discover">Discover</a></li>
            <li><a href="/search">Search</a></li>
            <li><a href="/settings">Settings</a></li>
        </ul>
    </nav>
    <div class="container" id="captcha-banner"
         hx-get="/api/captcha/status"
         hx-trigger="load, every 10s"
         hx-swap="innerHTML">
    </div>
    <div class="container" id="notifications"
         hx-get="/api/notifications"
         hx-trigger="load, every 30s"
         hx-swap="innerHTML">
    </div>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
    // Busy state for every htmx-triggering button: Pico renders a spinner for
    // aria-busy, and disabling prevents double submits while the request runs.
    document.addEventListener('htmx:beforeRequest', e => {
        const el = e.detail.elt;
        if (el && el.matches && el.matches('button, [role="button"]')) {
            el.setAttribute('aria-busy', 'true');
            el.dataset.busyLabel = el.textContent;
            el.disabled = true;
        }
    });
    document.addEventListener('htmx:afterRequest', e => {
        const el = e.detail.elt;
        if (el && el.hasAttribute && el.hasAttribute('aria-busy')) {
            el.removeAttribute('aria-busy');
            el.disabled = false;
        }
    });
    </script>
</body>
</html>
